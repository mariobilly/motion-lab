<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Lab — animated visual art studio</title>
<meta name="description" content="Motion Lab: a desktop studio for turning photos, video and music into layered, animated visual art.">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d0d13'/><circle cx='16' cy='16' r='9' fill='none' stroke='%235ce1ff' stroke-width='2.5'/><circle cx='16' cy='16' r='3' fill='%23ff3d8b'/></svg>">
</head>
<body>
  <div id="app" aria-busy="true"></div>

  <!-- Replaced by the boot sequence once the workspace is built; kept outside
       #app so it can never sit in front of the assembled interface. -->
  <div id="boot">
    <div class="boot-screen">
      <div class="spinner"></div>
      <div class="boot-screen__title">Starting Motion Lab…</div>
      <div class="boot-screen__note">Reading the media library and the most recent project.</div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="polite"></div>
  <div id="drop-root"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
